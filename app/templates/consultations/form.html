{% extends 'base.html' %}{% block title %}Nouvelle consultation · La Providence{% endblock %}{% block content %}
<div class="page-intro"><div><span class="eyebrow">DOSSIER CLINIQUE</span><h1>Nouvelle consultation</h1><p>Les informations cliniques sont conservées séparément des données administratives du patient.</p></div><a class="btn btn-quiet" href="{{ url_for('main.consultations') }}">Retour au registre</a></div>
<form method="post" class="panel form-grid clinical-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="field"><label>Patient *</label><select name="patient_id" required><option value="">Sélectionner un patient</option>{% for p in patients %}<option value="{{ p.id }}" {% if form.get('patient_id')==p.id|string %}selected{% endif %}>{{ p.patient_number }} — {{ p.full_name }}</option>{% endfor %}</select></div>
<div class="field"><label>Séjour en cours (facultatif)</label><select name="admission_id"><option value="">Consultation externe</option>{% for a in admissions %}<option value="{{ a.id }}" {% if form.get('admission_id')==a.id|string %}selected{% endif %}>{{ a.patient.patient_number }} — {{ a.patient.full_name }} · {{ a.admitted_at.strftime('%d/%m/%Y') }}</option>{% endfor %}</select></div>
<div class="field field-wide"><label>Motif de consultation *</label><textarea name="reason" rows="2" required>{{ form.get('reason','') }}</textarea></div>
<div class="field field-wide"><label>Antécédents et histoire de la maladie</label><textarea name="history" rows="3">{{ form.get('history','') }}</textarea></div>
<div class="field field-wide"><label>Examen clinique et observations</label><textarea name="examination" rows="3">{{ form.get('examination','') }}</textarea></div>
<div class="field field-wide"><label>Constantes et paramètres</label><div class="clinical-vitals"><label>Température °C<input name="temperature_c" type="number" step="0.1"></label><label>Tension systolique<input name="systolic_mmhg" type="number"></label><label>Tension diastolique<input name="diastolic_mmhg" type="number"></label><label>Pouls /min<input name="pulse_bpm" type="number"></label><label>Respiration /min<input name="respiratory_rate" type="number"></label><label>Saturation O₂ %<input name="oxygen_percent" type="number" step="0.1"></label><label>Poids kg<input name="weight_kg" type="number" step="0.01"></label><label>Taille cm<input name="height_cm" type="number" step="0.01"></label><label>Douleur /10<input name="pain_score" type="number" min="0" max="10"></label></div></div>
<div class="field field-wide"><label>Diagnostic / hypothèse diagnostique</label><textarea name="diagnosis" rows="3">{{ form.get('diagnosis','') }}</textarea></div>
<div class="field field-wide"><label>Conduite à tenir / plan de soins</label><textarea name="care_plan" rows="3">{{ form.get('care_plan','') }}</textarea></div>
<div class="field"><label>Suivi recommandé</label><input name="follow_up" value="{{ form.get('follow_up','') }}" placeholder="Ex. contrôle dans 7 jours"></div>
<div class="form-actions"><button class="btn" type="submit">Enregistrer la consultation</button></div></form>
{% endblock %}
