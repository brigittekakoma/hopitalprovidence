{% extends 'base.html' %}{% block title %}Nouveau rendez-vous — La Providence{% endblock %}{% block content %}
<section class="page-intro"><div><span class="eyebrow">PLANIFICATION DES SOINS</span><h1>Nouveau rendez-vous</h1><p>Planifiez une visite pour un patient déjà inscrit dans le registre administratif.</p></div><a class="btn secondary" href="{{ url_for('main.reception') }}">Retour à l'accueil</a></section>
<section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Patient<select name="patient_id" required><option value="">Choisir…</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.patient_number }} — {{ p.full_name }}</option>{% endfor %}</select></label><label>Date et heure<input type="datetime-local" name="scheduled_at" required></label><label>Service<select name="service_id"><option value="">Non précisé</option>{% for s in services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><label class="span-two">Motif<textarea name="reason" rows="3" placeholder="Motif du rendez-vous"></textarea></label><div class="span-two"><button class="btn primary">Enregistrer le rendez-vous</button></div></form></section>
{% endblock %}
