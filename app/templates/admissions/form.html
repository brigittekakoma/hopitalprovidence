{% extends 'base.html' %}{% block content %}
<section class="page-intro"><div><span class="eyebrow">NOUVEAU SÉJOUR</span><h1>Ouvrir une hospitalisation</h1><p>Enregistrez le patient et son affectation. L'affectation à un lit reste facultative si elle n'est pas encore décidée.</p></div><div class="actions"><a class="btn btn-quiet" href="{{ url_for('main.admission_capacity') }}">Configurer les lits</a><a class="btn btn-quiet" href="{{ url_for('main.admissions') }}">Retour au registre</a></div></section>
<form method="post" class="panel form-panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="field field-wide">Patient<select name="patient_id" required><option value="">Sélectionner un dossier patient</option>{% for p in patients %}<option value="{{ p.id }}" {{ 'selected' if form.get('patient_id')==p.id|string else '' }}>{{ p.patient_number }} — {{ p.full_name }}</option>{% endfor %}</select></label><label class="field">Service médical<select name="service_id"><option value="">À déterminer</option>{% for s in services %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><label class="field">Lit disponible<select name="bed_id"><option value="">Affectation ultérieure</option>{% for b in beds %}<option value="{{ b.id }}">{{ b.room.ward.name }} · Chambre {{ b.room.room_number }} · Lit {{ b.bed_code }}</option>{% endfor %}</select></label><label class="field field-wide">Motif administratif de l'admission<textarea name="admission_reason" rows="4" placeholder="À compléter selon les informations validées par le personnel habilité.">{{ form.get('admission_reason','') }}</textarea></label></div><div class="form-actions"><button class="btn btn-primary">Enregistrer l'admission</button></div></form>
{% endblock %}
