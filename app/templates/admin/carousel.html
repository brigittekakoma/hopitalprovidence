{% extends 'base.html' %}{% block title %}Carrousel de l’accueil{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">PARAMÈTRES DU SITE PUBLIC</span><h1>Carrousel professionnel</h1><p>Ajoutez, modifiez, ordonnez et activez les diapositives de la page d’accueil.</p></div></div><div class="panel"><h2>Nouvelle diapositive</h2><form method="post" action="{{ url_for('main.carousel_new') }}" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Titre<input name="title" required></label><label>Sous-titre<input name="subtitle"></label><label>Image (URL HTTPS)<input name="image_url" placeholder="https://…"></label><label>Texte du bouton<input name="button_label" value="Découvrir"></label><label>Lien du bouton<input name="button_url" value="/connexion"></label><label>Ordre<input type="number" name="position" value="0"></label><label><input type="checkbox" name="active" checked> Active</label><div class="form-actions"><button class="btn">Ajouter</button></div></form></div>{% for s in slides %}<div class="panel mt-3"><form method="post" action="{{ url_for('main.carousel_edit',slide_id=s.id) }}" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Titre<input name="title" value="{{ s.title }}" required></label><label>Sous-titre<input name="subtitle" value="{{ s.subtitle or '' }}"></label><label>Image URL<input name="image_url" value="{{ s.image_url or '' }}"></label><label>Bouton<input name="button_label" value="{{ s.button_label }}"></label><label>Lien<input name="button_url" value="{{ s.button_url }}"></label><label>Ordre<input type="number" name="position" value="{{ s.position }}"></label><label><input type="checkbox" name="active" {% if s.active %}checked{% endif %}> Active</label><div class="form-actions"><button class="btn">Enregistrer les modifications</button></div></form></div>{% endfor %}{% endblock %}
